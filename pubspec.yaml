name: astro_log
description: Keep logs of your astronomical observations.
publish_to: none
version: 2.7.1+303
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.10.0
  pdf: ^3.12.0
  intl: ^0.20.2
  location: ^10.0.2
  printing: ^5.14.3
  geocoding: ^5.0.0
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_analytics: ^13.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_facebook_auth: ^7.1.2
  cupertino_icons: ^2.0.0
  collection: ^1.19.1
  crypto: ^3.0.7
  csv: ^8.0.0
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^10.1.0
  json_annotation: ^4.12.0
  cached_network_image: ^4.0.6
  get: ^4.7.3
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  json_serializable: ^6.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  web:
    generate: true

flutter:
  generate: true
  uses-material-design: true
  config: # App-specific configuration flags that mirror `flutter config`
    enable-swift-package-manager: true
  licenses:
    - LICENSE
  assets:
    - assets/astrospheric.html
    - images/logo.png
    - images/original_files/logo_transparent_background.png
flutter_intl:
  enabled: true
