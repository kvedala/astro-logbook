name: astro_log
description: Keep logs of your astronomical observations.
publish_to: none
version: 2.7.1+301
environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.10.0
  intl: ^0.20.2
  location: ^8.0.0
  printing: ^5.11.0
  geocoding: ^4.0.0
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.1.1
  firebase_analytics: ^11.1.0
  google_sign_in: ^6.1.4
  flutter_signin_button: ^2.0.0
  sign_in_with_apple: ^7.0.1
  flutter_facebook_auth: ^7.0.1
  cupertino_icons: ^1.0.5
  ionicons: ^0.2.2
  collection: ^1.19.0
  crypto: ^3.0.3
  csv: ^6.0.0
  flutter_inappwebview: ^6.0.0-beta.24+1
  package_info_plus: ^8.0.0
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0
# flutter_icons:
#   android: launcher_icon
#   ios: true
#   remove_alpha_ios: true
#   image_path: images/logo.png
#   web:
#     generate: true
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/astrospheric.html
    - images/logo.png
    - images/original_files/logo_transparent_background.png
flutter_intl:
  enabled: true
