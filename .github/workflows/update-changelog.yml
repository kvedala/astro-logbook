name: Update changelog

on:
  pull_request_target:
    types: [opened, closed]

permissions:
  contents: write

jobs:
  update:
    if: >-
      (github.event.action == 'opened' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: automation
          persist-credentials: false

      - name: Check out branch to update
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.action == 'opened' && github.event.pull_request.head.ref || github.event.pull_request.base.ref }}
          fetch-depth: 0
          path: work

      - name: Fetch fork pull request history
        if: github.event.action == 'closed'
        working-directory: work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/changelog-pr-head"

      - name: Update changelog
        working-directory: work
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HISTORY_REF: ${{ github.event.action == 'opened' && 'HEAD' || 'refs/remotes/origin/changelog-pr-head' }}
          BRANCH: ${{ github.event.action == 'opened' && github.event.pull_request.head.ref || github.event.pull_request.base.ref }}
        run: |
          python3 ../automation/tools/update_changelog.py
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already contains this pull request."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "Update changelog for PR #${PR_NUMBER}"
          git push origin "HEAD:refs/heads/${BRANCH}"
