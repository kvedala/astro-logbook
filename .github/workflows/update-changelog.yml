name: Update changelog

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - name: Check whether this is the latest release tag
        id: latest_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
          if [ "$RELEASE_TAG" = "$latest_tag" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "Skipping changelog update for ${RELEASE_TAG}; latest tag is ${latest_tag}."
          fi

      - name: Generate release changelog
        if: steps.latest_tag.outputs.is_latest == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/update_changelog.py

      - name: Commit release changelog
        if: steps.latest_tag.outputs.is_latest == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-version:refname | sed -n '1p')
          if [ "${RELEASE_TAG}" != "${latest_tag}" ]; then
            echo "Skipping commit for ${RELEASE_TAG}; latest tag is ${latest_tag}."
            exit 0
          fi
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already matches ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "Update changelog for ${RELEASE_TAG}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
